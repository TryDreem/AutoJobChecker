# ============================================================================
#  Биржи с открытым API. Работают сразу, ключей не требуют.
# ============================================================================
jobboards:
  - provider: remoteok
    title: "RemoteOK"
    tags: [remote, worldwide]
    priority: 7

  - provider: remotive
    title: "Remotive"
    tags: [remote, worldwide]
    priority: 7
    options:
      queries: [python, backend, javascript, fullstack, django, fastapi]
      limit: 40

  - provider: arbeitnow
    title: "Arbeitnow — Европа"
    tags: [europe, poland]
    priority: 8
    options:
      pages: 3

  - provider: jobicy
    title: "Jobicy"
    tags: [remote, worldwide]
    priority: 6
    options:
      tags: [python, backend, javascript, full-stack]
      count: 50

  - provider: himalayas
    title: "Himalayas"
    tags: [remote, worldwide]
    priority: 6
    options:
      limit: 100
      pages: 2

  # Upwork: публичные RSS отключены с августа 2024, работаем через официальный
  # GraphQL API. Ключ бесплатный для личного использования — заявка подаётся в
  # API Center на upwork.com, рассмотрение около недели.
  # Как появятся ключи: впиши их в .env и включи источник в боте
  # («📡 Источники» → тап по строке).
  - provider: upwork
    title: "Upwork"
    tags: [freelance, gigs, dev]
    priority: 9
    enabled: false
    options:
      queries:
        - python
        - django
        - fastapi
        - python automation
        - telegram bot
        - web scraping python
        - backend api
        - javascript nodejs
      limit: 40

# ============================================================================
#  RSS/Atom-ленты. Сюда добавляется любая площадка со своим фидом —
#  достаточно вписать URL, отдельный код не нужен.
# ============================================================================
rss:
  - url: "https://weworkremotely.com/categories/remote-programming-jobs.rss"
    title: "We Work Remotely — Programming"
    tags: [remote, worldwide]
    priority: 6

  - url: "https://weworkremotely.com/categories/remote-back-end-programming-jobs.rss"
    title: "We Work Remotely — Backend"
    tags: [remote, backend]
    priority: 7
