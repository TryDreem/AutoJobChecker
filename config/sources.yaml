# ============================================================================
#  Каталог источников AutoChecker
# ----------------------------------------------------------------------------
#  Этот файл — стартовый список, а не окончательный. При запуске он заливается
#  в базу; уже существующие записи не перезаписываются, поэтому правки, сделанные
#  из бота (включить, выключить, добавить), не теряются.
#
#  ВАЖНО про Telegram-каналы: список собран из открытых подборок и часть каналов
#  могла переехать или закрыться. Не пытайся выверять его руками — нажми в боте
#  «📡 Источники» → «🩺 Проверить все». Бот резолвит каждый канал через твой
#  аккаунт, подставит настоящее название и число подписчиков, а те, до которых
#  не достучится трижды, отключит сам. Кнопка «🔎 Найти новые» ищет живые каналы
#  по ключевым словам прямо в Telegram — это надёжнее любого готового списка.
#
#  priority: 1–10, влияет на итоговую оценку постов (5 — нейтрально).
#  enabled:  false — источник заведён, но не опрашивается.
# ============================================================================

telegram:
